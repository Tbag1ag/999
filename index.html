
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>市场周刊 | Market Weekly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'market-dark': '#12141c',
            },
            borderRadius: {
              '4xl': '2rem',
              '5xl': '3rem',
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after {
        transition: background-color 0.4s, border-color 0.4s, color 0.4s, transform 0.4s, opacity 0.4s, backdrop-filter 0.4s, box-shadow 0.4s;
      }

      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        background: #0d1117;
        overflow-x: hidden;
      }

      .app-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -2;
        object-fit: cover;
        background-size: cover;
        background-position: center;
      }

      .app-bg-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.1) 100%);
        pointer-events: none;
      }

      /* 极致通透的奶油磨砂质感 - 参考用户参考图 */
      .bg-glass {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(80px) saturate(180%);
        -webkit-backdrop-filter: blur(80px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 
          0 20px 50px -10px rgba(0, 0, 0, 0.1),
          inset 0 0 20px rgba(255, 255, 255, 0.05);
      }

      .dark .bg-glass {
        background: rgba(20, 25, 35, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.04);
        box-shadow: 0 40px 100px -30px rgba(0, 0, 0, 0.4);
      }

      /* 参考图中底部的深色块质感 */
      .dark-glass {
        background: rgba(18, 20, 28, 0.65);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .stadium-nav {
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(40px) saturate(150%);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      .dark .stadium-nav {
        background: rgba(30, 35, 45, 0.5);
      }

      ::-webkit-scrollbar { width: 0px; }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "@neondatabase/serverless": "https://esm.sh/@neondatabase/serverless@^1.0.2"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
