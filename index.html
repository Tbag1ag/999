
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>市场周刊 | 沉浸式行情记录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
      /* 玻璃拟态全局优化 */
      *, *::before, *::after {
        transition-property: background-color, border-color, color, transform, box-shadow, backdrop-filter;
        transition-duration: 400ms;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }

      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        overflow-x: hidden;
      }

      .bg-glass {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(25px) saturate(180%);
        -webkit-backdrop-filter: blur(25px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .dark .bg-glass {
        background: rgba(15, 23, 17, 0.7);
        backdrop-filter: blur(30px) saturate(200%);
        -webkit-backdrop-filter: blur(30px) saturate(200%);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .main-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        object-fit: cover;
        transition: opacity 1s ease-in-out;
      }
      
      .main-bg-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: rgba(0,0,0,0.02);
        pointer-events: none;
      }

      .dark .main-bg {
        filter: brightness(0.7) contrast(1.1) saturate(1.2);
      }

      .font-serif {
        font-family: 'Playfair+Display', serif;
      }

      ::-webkit-scrollbar { width: 0px; }
      
      .stadium-nav {
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.4);
      }
      .dark .stadium-nav {
        background: rgba(20, 30, 25, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",

    "react": "https://esm.sh/react@^19.2.3",
    "vite": "https://esm.sh/vite@^7.3.1",

    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",

  }
}
</script>
